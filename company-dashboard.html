<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossCents Business — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="dash-header">
    <a class="logo" href="index.html">
      <span class="logo-text"><span class="logo-c">C</span>ross<span class="logo-c">C</span>ents</span>
    </a>
    <div class="who">
      <strong id="who-org">—</strong> · <span id="who-name">—</span>
      <span class="role-badge">Admin</span>
      <a href="#" class="btn btn-secondary btn-sm" style="margin-left:14px;" onclick="logout('company-login.html'); return false;">Log out</a>
    </div>
  </header>

  <div class="page">
    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">Active freelancers</div>
        <div class="value">4</div>
      </div>
      <div class="stat-tile">
        <div class="label">Paid this month</div>
        <div class="value emerald">$4,580.00</div>
      </div>
      <div class="stat-tile">
        <div class="label">Your role</div>
        <div class="value" style="font-size:1.1rem;">Payments Administrator</div>
      </div>
    </div>

    <div class="section-title">Your freelancers</div>
    <div class="card-table">
      <table>
        <thead>
          <tr><th>Name</th><th>Country</th><th>Last paid</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="freelancer-body"></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="pay-modal">
    <div class="modal">
      <h3>Send payment</h3>
      <div class="modal-sub" id="pay-target">To —</div>
      <div class="field">
        <label>Amount</label>
        <input type="number" id="pay-amount" placeholder="0.00" value="500" />
      </div>
      <div class="field">
        <label>Memo (optional)</label>
        <input type="text" placeholder="Invoice #, project name…" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('pay-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="confirmPay()">Send payment</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const session = Session.requireRole("company", "company-login.html");
    if (session) {
      document.getElementById("who-name").textContent = session.name;
      document.getElementById("who-org").textContent = session.org || "Xentir Pte Ltd";
    }

    const body = document.getElementById("freelancer-body");
    let payTarget = "";

    MOCK_FREELANCERS.forEach((f) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${f.name}</td>
        <td>${f.country}</td>
        <td>${f.lastPaid}</td>
        <td><span class="status-pill ${f.status === "Active" ? "complete" : "pending"}">${f.status}</span></td>
        <td><button class="btn btn-outline btn-sm" data-name="${f.name}">Send payment</button></td>
      `;
      body.appendChild(row);
    });

    body.addEventListener("click", (e) => {
      if (e.target.tagName === "BUTTON") {
        payTarget = e.target.getAttribute("data-name");
        document.getElementById("pay-target").textContent = "To " + payTarget;
        openModal("pay-modal");
      }
    });

    function confirmPay() {
      const amount = document.getElementById("pay-amount").value || "0.00";
      closeModal("pay-modal");
      showToast(`Payment of $${amount} sent to ${payTarget}.`);
    }
  </script>
</body>
</html>
