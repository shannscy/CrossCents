<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossCents — Freelancer sign in</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />

  <!--
    Descope Web Component.
    The Descope console gives you an exact, version-pinned copy of this
    snippet under your Flow's "Get Code" panel — paste that in here instead
    of trusting a hardcoded version number.
  -->
  <script src="https://descopecdn.com/npm/@descope/web-component@latest/dist/index.js"></script>
</head>
<body>

  <nav class="nav">
    <a class="logo" href="index.html"><span class="logo-text"><span class="logo-c">C</span>ross<span class="logo-c">C</span>ents</span></a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <a class="btn btn-secondary btn-sm" href="index.html">Back home</a>
    </div>
  </nav>

  <div class="center-page">
    <div class="auth-card">
      <span class="auth-badge freelancer">Freelancer</span>
      <h2>Sign in to CrossCents</h2>
      <div class="subtitle">Passwordless — we'll email you a code or magic link.</div>

      <div class="flow-mount" id="flow-mount">
        <div class="placeholder-copy">Loading sign-in…</div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    mountDescopeFlow({
      flowId: FREELANCER_FLOW_ID,
      onComplete: (name) => {
        Session.set("freelancer", name);
        window.location.href = "freelancer-jobs.html";
      },
    });
  </script>
</body>
</html>
