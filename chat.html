<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossCents — Chat with us</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="nav">
    <a class="logo" href="index.html"><span class="logo-text"><span class="logo-c">C</span>ross<span class="logo-c">C</span>ents</span></a>
    <div class="nav-links">
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>
    <div class="nav-actions">
      <a class="btn btn-secondary btn-sm" href="index.html">Back home</a>
    </div>
  </nav>

  <div class="center-page">
    <div class="chat-window">
      <div class="chat-header">
        <div style="font-weight:700;">Chat with CrossCents</div>
        <div class="status">● Usually replies within a few minutes</div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-bubble bot">Hi, I'm here to help. Ask about posting a job, applying to one, or how payments work on CrossCents.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendChat();" />
        <button class="btn btn-primary" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function addBubble(text, role) {
      const el = document.createElement("div");
      el.className = "chat-bubble " + role;
      el.textContent = text;
      const list = document.getElementById("chat-messages");
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
    }

    function sendChat() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      addBubble(text, "user");
      input.value = "";
      setTimeout(() => {
        addBubble("Thanks for the message — this is a mock-up, so no one's on the other end yet. For now, try the Contact us page and a real person will follow up.", "bot");
      }, 700);
    }
  </script>
</body>
</html>
