<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossCents — Company sign in</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://descopecdn.com/npm/@descope/web-component@latest/dist/index.js"></script>
</head>
<body>

  <nav class="nav">
    <a class="logo" href="index.html"><span class="logo-text"><span class="logo-c">C</span>ross<span class="logo-c">C</span>ents</span></a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <a class="btn btn-secondary btn-sm" href="index.html">Back home</a>
    </div>
  </nav>

  <div class="center-page">
    <div class="auth-card">
      <span class="auth-badge company">Company admin</span>
      <h2>Sign in to CrossCents Business</h2>
      <div class="subtitle">
        Admin accounts require a second verification step at sign-in —
        you're able to move money, so login itself is higher-assurance.
      </div>

      <div class="flow-mount" id="flow-mount">
        <div class="placeholder-copy">Loading sign-in…</div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    mountDescopeFlow({
      flowId: COMPANY_FLOW_ID,
      onComplete: async (name) => {
        // Bootstrap logs the login server-side and resolves role/org — the
        // frontend never declares "I'm a company admin" itself. If this
        // call fails, the dashboard's own requireRole() check will still
        // catch it (and bounce back here), so we don't hard-block on it.
        try {
          await api("/session/bootstrap", { method: "POST" });
        } catch (err) {
          console.error("Session bootstrap failed —", err.status, err.message);
        }
        window.location.href = "company-dashboard.html";
      },
    });
  </script>
</body>
</html>
