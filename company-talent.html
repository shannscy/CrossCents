<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossCents Business — Browse talent</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="dash-header">
    <a class="logo" href="index.html">
      <span class="logo-text"><span class="logo-c">C</span>ross<span class="logo-c">C</span>ents</span>
    </a>
    <div class="who">
      <strong id="who-org">—</strong> · <span id="who-name">—</span>
      <span class="role-badge">Admin</span>
      <a href="#" class="btn btn-secondary btn-sm" style="margin-left:14px;" onclick="logout('company-login.html'); return false;">Log out</a>
    </div>
  </header>

  <nav class="subnav">
    <a href="company-talent.html" class="active">Talent</a>
    <a href="company-post-job.html">Post a Job</a>
    <a href="company-dashboard.html">Payments</a>
  </nav>

  <div class="page">
    <div class="section-title" style="margin-top:0;">Browse talent</div>

    <div class="page-search">
      <input type="text" id="talent-search" placeholder="Search talent — name, headline, or skill" />
      <button class="btn btn-primary btn-sm" onclick="renderTalent()">Search</button>
    </div>

    <div class="category-row" style="justify-content:flex-start; margin-bottom:24px;" id="talent-categories"></div>

    <div class="listing-grid" id="talent-list"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const session = Session.requireRole("company", "company-login.html");
    if (session) {
      document.getElementById("who-name").textContent = session.name;
      document.getElementById("who-org").textContent = session.org || "Xentir Pte Ltd";
    }

    let activeCategory = "";
    const catRow = document.getElementById("talent-categories");
    const allBtn = document.createElement("button");
    allBtn.className = "category-chip active";
    allBtn.textContent = "All";
    allBtn.setAttribute("data-category", "");
    catRow.appendChild(allBtn);
    JOB_CATEGORIES.forEach((cat) => {
      const btn = document.createElement("button");
      btn.className = "category-chip";
      btn.textContent = cat;
      btn.setAttribute("data-category", cat);
      catRow.appendChild(btn);
    });

    catRow.addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;
      activeCategory = e.target.getAttribute("data-category") || "";
      catRow.querySelectorAll(".category-chip").forEach((c) => c.classList.remove("active"));
      e.target.classList.add("active");
      renderTalent();
    });

    function renderTalent() {
      const q = document.getElementById("talent-search").value.trim().toLowerCase();
      const list = document.getElementById("talent-list");
      list.innerHTML = "";

      const profiles = Object.values(FREELANCER_PROFILES).filter((p) => {
        const matchesCategory = !activeCategory || p.category === activeCategory;
        const haystack = (p.name + " " + p.headline + " " + p.skills.join(" ")).toLowerCase();
        const matchesQuery = !q || haystack.includes(q);
        return matchesCategory && matchesQuery;
      });

      if (profiles.length === 0) {
        list.innerHTML = `<div class="listing-card"><div class="listing-main"><p style="color:var(--navy-soft); margin:0;">No one matches that search yet — try another term or category.</p></div></div>`;
        return;
      }

      profiles.forEach((p) => {
        const card = document.createElement("div");
        card.className = "listing-card";
        card.innerHTML = `
          <div class="listing-main">
            <h4>${p.name}</h4>
            <div class="listing-meta">${p.headline}</div>
            <div class="listing-desc">${p.location} · ${p.yearsExp} years experience</div>
            <div class="tag-row">${p.skills.map((s) => `<span class="tag">${s}</span>`).join("")}</div>
          </div>
          <div class="listing-side">
            <button class="btn btn-primary btn-sm" data-name="${p.name}">Invite to apply</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    document.getElementById("talent-list").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON" || !e.target.dataset.name) return;
      showToast(`Invitation sent to ${e.target.dataset.name} — you'll see it in Payments once they accept and a contract is signed.`);
    });

    renderTalent();
  </script>
</body>
</html>
